  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <style>

    @media (max-width: 1180px) { .app-header { grid-template-columns: minmax(220px, max-content) minmax(0, 1fr); grid-template-rows: auto auto; align-items: center; } .brand { grid-column: 1; grid-row: 1; } .toolbar { grid-column: 1 / -1; grid-row: 2; justify-content: flex-end; flex-wrap: nowrap; width: 100%; } .select-control { width: min(42vw, 360px); flex: 0 1 360px; } }

      .toolbar { grid-column: 1 / -1; grid-row: 2; display: grid; grid-template-columns: minmax(0, 1fr) 86px 36px 36px 36px; align-items: center; width: 100%; gap: 6px; }

      .icon-button { width: 36px; min-width: 36px; font-size: 1.05rem; }
      #prevButton, #nextButton, .notification-button { flex-basis: 36px; height: 36px; max-width: 36px; min-height: 36px; min-width: 36px; width: 36px; }
      #prevButton svg, #nextButton svg { width: 20px; height: 20px; }

      #calendar { min-height: calc(100dvh - 178px); }

      body.side-panel-open .side-panel { transform: translateX(0); }
      .drawer-backdrop { position: fixed; inset: 0; z-index: 35; display: block; pointer-events: none; opacity: 0; background: rgba(15,23,42,.38); backdrop-filter: blur(2px); transition: opacity .2s ease; }

    @media (max-width: 460px) { .app-header { grid-template-columns: 40px minmax(136px, max-content) minmax(0, 1fr); } .toolbar { grid-template-columns: minmax(0, 1fr) 80px 36px 36px 36px; gap: 5px; } .view-control { width: 80px; padding-inline: 8px; } dialog { width: calc(100vw - 16px); border-radius: 12px; } .modal-header, .modal-body { padding-inline: 14px; } }

<body>
  <header class="app-header">
    <button class="icon-button menu-button" id="sidePanelButton" type="button" aria-label="Open details menu" aria-controls="sidePanel" aria-expanded="false"><span aria-hidden="true"></span></button>
    <div class="brand" aria-label="CSC S.Y.N.C."><div class="brand-mark"><img src="assets/csc-logo.png" alt="CSC logo"></div><div class="brand-title"><strong>CSC S.Y.N.C.</strong><span>Systemized Year-round Network Calendar</span></div></div>
    <div class="toolbar" aria-label="Calendar controls">
      <select class="control select-control" id="organizationFilter" aria-label="Filter by organization"><option value="">All organizations</option></select>
      <select class="control view-control" id="viewSelect" aria-label="Calendar view"><option value="dayGridMonth">Month</option><option value="timeGridWeek">Week</option><option value="timeGridDay">Day</option><option value="listMonth">List</option></select>
      <button class="icon-button" id="prevButton" type="button" aria-label="Previous period"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 18l-6-6 6-6"></path></svg></button>
      <button class="icon-button" id="nextButton" type="button" aria-label="Next period"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"></path></svg></button>
      <button class="icon-button notification-button" id="announcementButton" type="button" aria-label="Announcements"><span aria-hidden="true">🔔</span><span class="badge" id="announcementBadge">0</span></button>
    </div>
  </header>
  <div class="calendar-title" id="calendarTitle">Calendar</div>
  <main>
    <section class="calendar-panel" aria-label="Approved calendar"><div id="calendar"></div></section>
    <aside class="side-panel" id="sidePanel" aria-label="Calendar details">
      <section class="panel-section announcement-section"><h2>Announcements</h2><div id="announcementList"><div class="empty-state">No announcements posted.</div></div></section>
      <section class="panel-section status-section"><h2>CSC President</h2><article class="status-card"><span class="status-value" id="presidentStatusValue">Status not posted</span><a class="status-call" id="presidentStatusCall" hidden>Call CSC President</a></article></section>
      <section class="panel-section status-section"><h2>OIC (Off Campus/In Campus Coordinator)</h2><article class="status-card"><span class="status-value" id="oicStatusValue">Status not posted</span><a class="status-call" id="oicStatusCall" hidden>Call OIC</a></article></section>
    </aside>
  </main>
  <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>
  <div class="loading-banner" id="loadingBanner">Loading calendar</div>
  <dialog id="eventDialog"><article class="modal-card"><div class="modal-header"><div><h2 id="eventDialogTitle">Schedule</h2><span class="small-muted" id="eventDialogSubtitle"></span></div><button class="icon-button" id="closeEventDialog" type="button" aria-label="Close">&times;</button></div><div class="modal-body"><div class="detail-grid" id="eventDetails"></div></div></article></dialog>
  <dialog id="announcementDialog"><article class="modal-card"><div class="modal-header"><div><h2>Announcements</h2><span class="small-muted">Latest public updates</span></div><button class="icon-button" id="closeAnnouncementDialog" type="button" aria-label="Close">&times;</button></div><div class="modal-body" id="announcementDialogBody"></div></article></dialog>
  <script>
    window.SUPABASE_CONFIG = Object.freeze({ url: 'https://ockpzmmpxebqmeipirsz.supabase.co', publishableKey: 'sb_publishable_67aTD3F2GDhTpoiHzpYkdw_4fQrUJms' });
    const PALETTE = ['#2563eb', '#9333ea', '#16a34a', '#dc2626', '#0891b2', '#ea580c', '#4f46e5', '#0f766e', '#be123c', '#7c3aed', '#15803d', '#b45309'];
    const STATUS_EMAIL_MAP = { 'president@aup.edu.ph': 'president', 'cscadmin2@aup.edu.ph': 'president', 'cscadviser@aup.edu.ph': 'oic', 'cscadmin1@aup.edu.ph': 'oic' };
    const state = { calendar: null, allEvents: [], organizations: [], announcements: [], orgColors: new Map() };
    document.addEventListener('DOMContentLoaded', init);
    async function init() { bindControls(); buildCalendar(); await refreshAll(); }
    function bindControls() { byId('prevButton').addEventListener('click', () => { state.calendar.prev(); updateTitle(); }); byId('nextButton').addEventListener('click', () => { state.calendar.next(); updateTitle(); }); byId('viewSelect').addEventListener('change', (event) => { state.calendar.changeView(event.target.value); updateTitle(); }); byId('organizationFilter').addEventListener('change', renderCalendarEvents); byId('announcementButton').addEventListener('click', openAnnouncementDialog); byId('sidePanelButton').addEventListener('click', toggleSidePanel); byId('drawerBackdrop').addEventListener('click', closeSidePanel); byId('closeEventDialog').addEventListener('click', () => byId('eventDialog').close()); byId('closeAnnouncementDialog').addEventListener('click', () => byId('announcementDialog').close()); byId('eventDialog').addEventListener('click', closeOnBackdrop); byId('announcementDialog').addEventListener('click', closeOnBackdrop); document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeSidePanel(); }); window.addEventListener('resize', debounce(() => { if (window.innerWidth > 720) closeSidePanel(); if (state.calendar) state.calendar.updateSize(); }, 150)); }
    function buildCalendar() { const calendarEl = byId('calendar'); state.calendar = new FullCalendar.Calendar(calendarEl, { initialView: 'dayGridMonth', height: 'auto', dayMaxEvents: true, nowIndicator: true, eventDisplay: 'block', slotMinTime: '06:00:00', slotMaxTime: '23:59:00', headerToolbar: false, eventClick(info) { info.jsEvent.preventDefault(); openEventDialog(info.event); }, eventDidMount(info) { info.el.title = `${info.event.title} (${info.event.extendedProps.organization || 'Organization'})`; } }); state.calendar.render(); updateTitle(); byId('viewSelect').value = state.calendar.view.type; }
    async function refreshAll() { showLoading(true); try { const [items, orgs, announcements, profiles] = await Promise.all([rest('/rest/v1/calendar_items?select=*&approval_status=eq.approved&order=start_time.asc'), rest('/rest/v1/organizations?select=*&order=organization_name.asc'), rest('/rest/v1/announcements?select=*&visibility_status=eq.show&order=updated_at.desc'), rest('/rest/v1/profiles?select=*&email=in.(president@aup.edu.ph,cscadmin2@aup.edu.ph,cscadviser@aup.edu.ph,cscadmin1@aup.edu.ph)')]); state.organizations = Array.isArray(orgs) ? orgs : []; state.allEvents = normalizeCalendarItems(Array.isArray(items) ? items : []); state.announcements = normalizeAnnouncements(Array.isArray(announcements) ? announcements : []); assignOrganizationColors(); renderFilters(); renderCalendarEvents(); renderAnnouncements(); renderStatuses(Array.isArray(profiles) ? profiles : []); } catch (error) { console.error(error); byId('announcementList').innerHTML = `<div class="empty-state">Calendar could not load. ${escapeHtml(error.message || 'Please try again later.')}</div>`; } finally { showLoading(false); } }
    async function rest(endpoint) { const { url, publishableKey } = window.SUPABASE_CONFIG; const response = await fetch(`${url}${endpoint}`, { headers: { apikey: publishableKey, Authorization: `Bearer ${publishableKey}`, 'Content-Type': 'application/json' } }); const payload = await response.json().catch(() => null); if (!response.ok) throw new Error(payload?.message || payload?.error || `Request failed (${response.status})`); return payload; }
    function normalizeCalendarItems(rows) { return rows.filter(isVisibleApprovedSchedule).flatMap((row) => occurrencesForRow(row).map((occurrence, index) => { const organization = organizationName(row); const colorKey = organizationKey(row, organization); const color = colorForKey(colorKey); return { id: `${row.id || createId()}-${occurrence.id || index}`, title: row.title || row.activity_description || row.category_id || 'Approved schedule', start: toIsoDateTime(occurrence.start_time, occurrence.date), end: toIsoDateTime(occurrence.end_time, occurrence.date), allDay: !occurrence.start_time && !occurrence.end_time, backgroundColor: color, borderColor: color, textColor: '#ffffff', extendedProps: { record: row, occurrence, organization, colorKey } }; })).filter((event) => event.start); }
    function isVisibleApprovedSchedule(row) { const status = lower(row.event_status || row.status || ''); const privacy = lower(row.privacy_level || ''); if (row.record_type && row.record_type !== 'schedule') return false; if (lower(row.approval_status) !== 'approved') return false; if (['cancelled', 'canceled', 'deleted', 'rejected', 'declined', 'archived'].includes(status)) return false; if (['private', 'internal', 'draft'].includes(privacy)) return false; return true; }
    function occurrencesForRow(row) { const saved = parseArray(row.occurrences); if (saved.length) return saved; const start = row.start_time || row.start_date; const end = row.end_time || row.end_date || row.start_time; const base = { id: row.id || createId(), date: dateOnly(start), start_time: start, end_time: end }; const repeat = lower(row.repeat || row.repeat_pattern || row.recurrence || row.recurrence_rule || ''); const until = dateOnly(row.repeat_until || row.recurrence_until || row.end_date); if (!repeat || repeat.includes('does not') || repeat === 'none' || !until) return [base]; return expandRepeat(base, repeat, until); }
    function expandRepeat(base, repeat, until) { const dates = []; const step = repeat.includes('month') ? 'month' : repeat.includes('day') ? 'day' : 'week'; const current = noonDate(base.date); const last = noonDate(until); if (!current || !last || current > last) return [base]; while (current <= last && dates.length < 370) { dates.push(localDate(current)); if (step === 'month') current.setMonth(current.getMonth() + 1); else current.setDate(current.getDate() + (step === 'day' ? 1 : 7)); } return dates.map((date, index) => ({ id: `${base.id}-repeat-${index}`, date, start_time: combineDateTime(date, base.start_time), end_time: combineDateTime(date, base.end_time) })); }
    function renderCalendarEvents() { const orgFilter = byId('organizationFilter').value; const events = state.allEvents.filter((event) => !orgFilter || event.extendedProps.colorKey === orgFilter); state.calendar.removeAllEvents(); state.calendar.addEventSource(events); updateTitle(); }
    function renderFilters() { const select = byId('organizationFilter'); const options = organizationFilterOptions(); select.innerHTML = '<option value="">All organizations</option>' + options.map((item) => `<option value="${escapeHtml(item.key)}">${escapeHtml(item.label)}</option>`).join(''); }
    function organizationFilterOptions() { const map = new Map(); state.organizations.forEach((org) => { const label = org.organization_name || org.name || org.full_name || 'Unnamed organization'; map.set(organizationKey(org, label), { key: organizationKey(org, label), label }); }); state.allEvents.forEach((event) => { if (!map.has(event.extendedProps.colorKey)) map.set(event.extendedProps.colorKey, { key: event.extendedProps.colorKey, label: event.extendedProps.organization || 'Unassigned' }); }); return [...map.values()].sort((a, b) => a.label.localeCompare(b.label)); }
    function assignOrganizationColors() { state.orgColors.clear(); state.organizations.forEach((org, index) => { const key = organizationKey(org, org.organization_name || org.name); const saved = org.color || org.organization_color || org.assigned_color || org.theme_color || org.color_hex; state.orgColors.set(key, isCssColor(saved) ? saved : PALETTE[index % PALETTE.length]); }); state.allEvents.forEach((event) => { if (!state.orgColors.has(event.extendedProps.colorKey)) state.orgColors.set(event.extendedProps.colorKey, PALETTE[state.orgColors.size % PALETTE.length]); event.backgroundColor = colorForKey(event.extendedProps.colorKey); event.borderColor = colorForKey(event.extendedProps.colorKey); }); }
    function renderAnnouncements() { const badge = byId('announcementBadge'); badge.textContent = String(state.announcements.length); badge.classList.toggle('show', state.announcements.length > 0); const list = byId('announcementList'); list.innerHTML = state.announcements.length ? state.announcements.slice(0, 5).map(announcementCardHtml).join('') : '<div class="empty-state">No announcements posted.</div>'; }
    function normalizeAnnouncements(rows) { return rows.filter((item) => !['hidden', 'draft', 'deleted', 'archived'].includes(lower(item.visibility_status || item.status || item.announcement_status || ''))); }
    function announcementCardHtml(item) { const title = item.title || item.subject || 'Announcement'; const body = item.message || item.content || item.description || item.body || ''; const source = item.posted_by || item.source_council || item.created_by_email || item.source_email || ''; return `<article class="announcement-card"><strong>${escapeHtml(title)}</strong><p>${escapeHtml(body || 'No details provided.')}</p>${source ? `<span class="announcement-source">From: ${escapeHtml(source)}</span>` : ''}</article>`; }
    function renderStatuses(profiles) { const normalized = { president: null, oic: null }; profiles.forEach((profile) => { const id = STATUS_EMAIL_MAP[lower(profile.email)]; if (id && !normalized[id]) normalized[id] = profile; }); renderStatus('president', normalized.president); renderStatus('oic', normalized.oic); }
    function renderStatus(id, profile) { const valueEl = byId(`${id}StatusValue`); const callEl = byId(`${id}StatusCall`); valueEl.textContent = profile?.activity_status || profile?.status_label || 'Status not posted'; const phone = String(profile?.contact_number || profile?.phone_number || profile?.mobile_number || profile?.contact_info || '').replace(/[^\d+]/g, ''); if (callEl) { callEl.hidden = !phone; if (phone) callEl.href = `tel:${phone}`; } }
    function openEventDialog(event) { const record = event.extendedProps.record || {}; byId('eventDialogTitle').textContent = event.title; byId('eventDialogSubtitle').textContent = event.extendedProps.organization || 'Approved schedule'; const repeatUntil = record.repeat_until || record.recurrence_until || ''; const details = { Organization: event.extendedProps.organization, Venue: record.venue, Start: formatDateTime(event.start), End: event.end ? formatDateTime(event.end) : '', Category: record.category_id || record.event_type || record.category, Status: readable(record.approval_status), Repeat: readable(record.repeat || record.repeat_pattern || record.recurrence || 'Does not repeat'), 'Repeat Until': repeatUntil ? formatDate(repeatUntil) : '', 'Contact Person': record.contact_person, 'Contact Info': record.contact_info, Description: record.public_description || record.activity_description, Purpose: record.purpose }; byId('eventDetails').innerHTML = Object.entries(details).filter(([, value]) => value != null && String(value).trim()).map(([label, value]) => `<div class="detail-item"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`).join(''); byId('eventDialog').showModal(); }
    function openAnnouncementDialog() { byId('announcementDialogBody').innerHTML = state.announcements.length ? state.announcements.map(announcementCardHtml).join('') : '<div class="empty-state">No announcements posted.</div>'; byId('announcementDialog').showModal(); }
    function updateTitle() { if (state.calendar) byId('calendarTitle').textContent = state.calendar.view.title || 'Calendar'; }
    function organizationName(row) { const org = state.organizations.find((item) => item.id === row.organization_id || lower(item.organization_name || item.name) === lower(row.organization_name)); return row.organization_name || org?.organization_name || org?.name || row.created_by_role || 'Unassigned'; }
    function organizationKey(row, name) { return String(row.organization_id || row.organization_name || name || row.id || 'unassigned').trim().toLowerCase(); }
    function colorForKey(key) { if (state.orgColors.has(key)) return state.orgColors.get(key); const color = PALETTE[Math.abs(hash(key)) % PALETTE.length]; state.orgColors.set(key, color); return color; }
    function parseArray(value) { if (Array.isArray(value)) return value; if (typeof value !== 'string' || !value.trim()) return []; try { const parsed = JSON.parse(value); return Array.isArray(parsed) ? parsed : []; } catch { return []; } }
    function toIsoDateTime(value, fallbackDate) { if (!value && fallbackDate) return fallbackDate; if (!value) return ''; const text = String(value); if (/^\d{4}-\d{2}-\d{2}T/.test(text)) return text; if (/^\d{4}-\d{2}-\d{2}\s/.test(text)) return text.replace(' ', 'T'); if (/^\d{2}:\d{2}/.test(text) && fallbackDate) return `${fallbackDate}T${text}`; return text; }
    function combineDateTime(date, value) { const time = timeOnly(value); return time ? `${date}T${time}:00` : date; }
    function timeOnly(value) { const text = String(value || ''); const match = text.match(/T(\d{2}:\d{2})/) || text.match(/\s(\d{2}:\d{2})/) || text.match(/^(\d{2}:\d{2})/); return match ? match[1] : ''; }
    function dateOnly(value) { if (!value) return ''; const text = String(value); const match = text.match(/^\d{4}-\d{2}-\d{2}/); if (match) return match[0]; const date = new Date(value); return Number.isNaN(date.getTime()) ? '' : localDate(date); }
    function noonDate(value) { const date = new Date(`${dateOnly(value)}T12:00:00`); return Number.isNaN(date.getTime()) ? null : date; }
    function localDate(date) { return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
    function formatDate(value) { const date = new Date(value); return Number.isNaN(date.getTime()) ? String(value || '') : date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }); }
    function formatDateTime(value) { const date = value instanceof Date ? value : new Date(value); return Number.isNaN(date.getTime()) ? String(value || '') : date.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }); }
    function readable(value) { const text = String(value || '').replace(/[_-]/g, ' ').trim(); return text ? text.replace(/\b\w/g, (letter) => letter.toUpperCase()) : ''; }
    function lower(value) { return String(value || '').trim().toLowerCase(); }
    function escapeHtml(value) { return String(value == null ? '' : value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char])); }
    function hash(value) { return String(value || '').split('').reduce((total, char) => ((total << 5) - total) + char.charCodeAt(0), 0); }
    function isCssColor(value) { return typeof value === 'string' && /^(#(?:[0-9a-f]{3}){1,2}|rgb\(|rgba\(|hsl\(|hsla\()/i.test(value.trim()); }
    function showLoading(show) { byId('loadingBanner').classList.toggle('show', show); }
    function toggleSidePanel() { document.body.classList.contains('side-panel-open') ? closeSidePanel() : openSidePanel(); }
    function openSidePanel() { document.body.classList.add('side-panel-open'); byId('sidePanelButton').setAttribute('aria-expanded', 'true'); }
    function closeSidePanel() { document.body.classList.remove('side-panel-open'); byId('sidePanelButton').setAttribute('aria-expanded', 'false'); }
    function closeOnBackdrop(event) { if (event.target === event.currentTarget) event.currentTarget.close(); }
    function debounce(fn, delay) { let timer = 0; return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), delay); }; }
    function createId() { return crypto?.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`; }
    function byId(id) { return document.getElementById(id); }
  </script>
