  <style>

    @media (max-width: 1180px) { .app-header { grid-template-columns: 1fr; justify-items: stretch; } .calendar-title { order: 2; text-align: left; } .toolbar { order: 3; justify-content: flex-start; flex-wrap: wrap; } .brand { order: 1; } .select-control { width: min(100%, 380px); flex: 1 1 260px; } }

    @media (max-width: 460px) { .toolbar { grid-template-columns: minmax(0, 1fr) 86px 36px 36px 36px; } .view-control { width: 86px; } .brand-title strong { max-width: 220px; } dialog { width: calc(100vw - 16px); border-radius: 12px; } .modal-header, .modal-body { padding-inline: 14px; } }
  </style>

<body>
  <header class="app-header">
    <div class="brand" aria-label="CSC S.Y.N.C."><div class="brand-mark"><img src="assets/csc-logo.png" alt="CSC logo"></div><div class="brand-title"><strong>CSC S.Y.N.C.</strong><span>Systemized Year-round Network Calendar</span></div></div>
    <div class="calendar-title" id="calendarTitle">Calendar</div>
    <div class="toolbar" aria-label="Calendar controls">

      <select class="control view-control" id="viewSelect" aria-label="Calendar view"><option value="dayGridMonth">Month</option><option value="timeGridWeek">Week</option><option value="timeGridDay">Day</option><option value="listMonth">List</option></select>

      <button class="icon-button" id="nextButton" type="button" aria-label="Next period">&gt;</button>
      <button class="icon-button notification-button" id="announcementButton" type="button" aria-label="Announcements"><span aria-hidden="true">🔔</span><span class="badge" id="announcementBadge">0</span></button>
    </div>
  </header>
  <main>
    <section class="calendar-panel" aria-label="Approved calendar"><div id="calendar"></div></section>
    <aside class="side-panel" aria-label="Calendar details">
      <section class="panel-section"><h2>Status</h2><article class="status-card"><strong>CSC President</strong><span class="status-value" id="presidentStatusValue">Status not posted</span><span class="small-muted" id="presidentStatusMeta">Waiting for update</span></article><article class="status-card"><strong>OIC</strong><span class="status-value" id="oicStatusValue">Status not posted</span><span class="small-muted" id="oicStatusMeta">Waiting for update</span></article></section>
      <section class="panel-section"><h2>Announcements</h2><div id="announcementList"><div class="empty-state">No announcements posted.</div></div></section>
    </aside>
  </main>
  <div class="loading-banner" id="loadingBanner">Loading calendar</div>
  <dialog id="eventDialog"><article class="modal-card"><div class="modal-header"><div><h2 id="eventDialogTitle">Schedule</h2><span class="small-muted" id="eventDialogSubtitle"></span></div><button class="icon-button" id="closeEventDialog" type="button" aria-label="Close">&times;</button></div><div class="modal-body"><div class="detail-grid" id="eventDetails"></div></div></article></dialog>
  <dialog id="announcementDialog"><article class="modal-card"><div class="modal-header"><div><h2>Announcements</h2><span class="small-muted">Latest public updates</span></div><button class="icon-button" id="closeAnnouncementDialog" type="button" aria-label="Close">&times;</button></div><div class="modal-body" id="announcementDialogBody"></div></article></dialog>
  <script>
    window.SUPABASE_CONFIG = Object.freeze({ url: 'https://ockpzmmpxebqmeipirsz.supabase.co', publishableKey: 'sb_publishable_67aTD3F2GDhTpoiHzpYkdw_4fQrUJms' });
    const PALETTE = ['#2563eb', '#9333ea', '#16a34a', '#dc2626', '#0891b2', '#ea580c', '#4f46e5', '#0f766e', '#be123c', '#7c3aed', '#15803d', '#b45309'];
    const STATUS_EMAIL_MAP = { 'president@aup.edu.ph': 'president', 'cscadmin2@aup.edu.ph': 'president', 'cscadviser@aup.edu.ph': 'oic', 'cscadmin1@aup.edu.ph': 'oic' };
    const state = { calendar: null, allEvents: [], organizations: [], announcements: [], orgColors: new Map() };
    document.addEventListener('DOMContentLoaded', init);
    async function init() { bindControls(); buildCalendar(); await refreshAll(); }
    function bindControls() { byId('prevButton').addEventListener('click', () => { state.calendar.prev(); updateTitle(); }); byId('nextButton').addEventListener('click', () => { state.calendar.next(); updateTitle(); }); byId('viewSelect').addEventListener('change', (event) => { state.calendar.changeView(event.target.value); updateTitle(); }); byId('organizationFilter').addEventListener('change', renderCalendarEvents); byId('announcementButton').addEventListener('click', openAnnouncementDialog); byId('closeEventDialog').addEventListener('click', () => byId('eventDialog').close()); byId('closeAnnouncementDialog').addEventListener('click', () => byId('announcementDialog').close()); byId('eventDialog').addEventListener('click', closeOnBackdrop); byId('announcementDialog').addEventListener('click', closeOnBackdrop); window.addEventListener('resize', debounce(() => state.calendar && state.calendar.updateSize(), 150)); }
    function buildCalendar() { const calendarEl = byId('calendar'); state.calendar = new FullCalendar.Calendar(calendarEl, { initialView: window.innerWidth < 640 ? 'listMonth' : 'dayGridMonth', height: 'auto', dayMaxEvents: true, nowIndicator: true, eventDisplay: 'block', slotMinTime: '06:00:00', slotMaxTime: '23:59:00', headerToolbar: false, eventClick(info) { info.jsEvent.preventDefault(); openEventDialog(info.event); }, eventDidMount(info) { info.el.title = `${info.event.title} (${info.event.extendedProps.organization || 'Organization'})`; } }); state.calendar.render(); updateTitle(); byId('viewSelect').value = state.calendar.view.type; }
    async function refreshAll() { showLoading(true); try { const [items, orgs, announcements, profiles] = await Promise.all([rest('/rest/v1/calendar_items?select=*&approval_status=eq.approved&order=start_time.asc'), rest('/rest/v1/organizations?select=*&order=organization_name.asc'), rest('/rest/v1/announcements?select=*&order=created_at.desc'), rest('/rest/v1/profiles?select=id,email,full_name,account_type,activity_status,status_label,status_updated_at,updated_at,created_at&email=in.(president@aup.edu.ph,cscadmin2@aup.edu.ph,cscadviser@aup.edu.ph,cscadmin1@aup.edu.ph)')]); state.organizations = Array.isArray(orgs) ? orgs : []; state.allEvents = normalizeCalendarItems(Array.isArray(items) ? items : []); state.announcements = normalizeAnnouncements(Array.isArray(announcements) ? announcements : []); assignOrganizationColors(); renderFilters(); renderCalendarEvents(); renderAnnouncements(); renderStatuses(Array.isArray(profiles) ? profiles : []); } catch (error) { console.error(error); byId('announcementList').innerHTML = `<div class="empty-state">Calendar could not load. ${escapeHtml(error.message || 'Please try again later.')}</div>`; } finally { showLoading(false); } }
    async function rest(endpoint) { const { url, publishableKey } = window.SUPABASE_CONFIG; const response = await fetch(`${url}${endpoint}`, { headers: { apikey: publishableKey, Authorization: `Bearer ${publishableKey}`, 'Content-Type': 'application/json' } }); const payload = await response.json().catch(() => null); if (!response.ok) throw new Error(payload?.message || payload?.error || `Request failed (${response.status})`); return payload; }
    function normalizeCalendarItems(rows) { return rows.filter(isVisibleApprovedSchedule).flatMap((row) => occurrencesForRow(row).map((occurrence, index) => { const organization = organizationName(row); const colorKey = organizationKey(row, organization); const color = colorForKey(colorKey); return { id: `${row.id || createId()}-${occurrence.id || index}`, title: row.title || row.activity_description || row.category_id || 'Approved schedule', start: toIsoDateTime(occurrence.start_time, occurrence.date), end: toIsoDateTime(occurrence.end_time, occurrence.date), allDay: !occurrence.start_time && !occurrence.end_time, backgroundColor: color, borderColor: color, textColor: '#ffffff', extendedProps: { record: row, occurrence, organization, colorKey } }; })).filter((event) => event.start); }
    function isVisibleApprovedSchedule(row) { const status = lower(row.event_status || row.status || ''); const privacy = lower(row.privacy_level || ''); if (row.record_type && row.record_type !== 'schedule') return false; if (lower(row.approval_status) !== 'approved') return false; if (['cancelled', 'canceled', 'deleted', 'rejected', 'declined', 'archived'].includes(status)) return false; if (['private', 'internal', 'draft'].includes(privacy)) return false; return true; }
    function occurrencesForRow(row) { const saved = parseArray(row.occurrences); if (saved.length) return saved; const start = row.start_time || row.start_date; const end = row.end_time || row.end_date || row.start_time; const base = { id: row.id || createId(), date: dateOnly(start), start_time: start, end_time: end }; const repeat = lower(row.repeat || row.repeat_pattern || row.recurrence || row.recurrence_rule || ''); const until = dateOnly(row.repeat_until || row.recurrence_until || row.end_date); if (!repeat || repeat.includes('does not') || repeat === 'none' || !until) return [base]; return expandRepeat(base, repeat, until); }
    function expandRepeat(base, repeat, until) { const dates = []; const step = repeat.includes('month') ? 'month' : repeat.includes('day') ? 'day' : 'week'; const current = noonDate(base.date); const last = noonDate(until); if (!current || !last || current > last) return [base]; while (current <= last && dates.length < 370) { dates.push(localDate(current)); if (step === 'month') current.setMonth(current.getMonth() + 1); else current.setDate(current.getDate() + (step === 'day' ? 1 : 7)); } return dates.map((date, index) => ({ id: `${base.id}-repeat-${index}`, date, start_time: combineDateTime(date, base.start_time), end_time: combineDateTime(date, base.end_time) })); }
    function renderCalendarEvents() { const orgFilter = byId('organizationFilter').value; const events = state.allEvents.filter((event) => !orgFilter || event.extendedProps.colorKey === orgFilter); state.calendar.removeAllEvents(); state.calendar.addEventSource(events); updateTitle(); }
    function renderFilters() { const select = byId('organizationFilter'); const options = organizationFilterOptions(); select.innerHTML = '<option value="">All organizations</option>' + options.map((item) => `<option value="${escapeHtml(item.key)}">${escapeHtml(item.label)}</option>`).join(''); }
    function organizationFilterOptions() { const map = new Map(); state.organizations.forEach((org) => { const label = org.organization_name || org.name || org.full_name || 'Unnamed organization'; map.set(organizationKey(org, label), { key: organizationKey(org, label), label }); }); state.allEvents.forEach((event) => { if (!map.has(event.extendedProps.colorKey)) map.set(event.extendedProps.colorKey, { key: event.extendedProps.colorKey, label: event.extendedProps.organization || 'Unassigned' }); }); return [...map.values()].sort((a, b) => a.label.localeCompare(b.label)); }
    function assignOrganizationColors() { state.orgColors.clear(); state.organizations.forEach((org, index) => { const key = organizationKey(org, org.organization_name || org.name); const saved = org.color || org.organization_color || org.assigned_color || org.theme_color || org.color_hex; state.orgColors.set(key, isCssColor(saved) ? saved : PALETTE[index % PALETTE.length]); }); state.allEvents.forEach((event) => { if (!state.orgColors.has(event.extendedProps.colorKey)) state.orgColors.set(event.extendedProps.colorKey, PALETTE[state.orgColors.size % PALETTE.length]); event.backgroundColor = colorForKey(event.extendedProps.colorKey); event.borderColor = colorForKey(event.extendedProps.colorKey); }); }
    function renderAnnouncements() { const badge = byId('announcementBadge'); badge.textContent = String(state.announcements.length); badge.classList.toggle('show', state.announcements.length > 0); const list = byId('announcementList'); list.innerHTML = state.announcements.length ? state.announcements.slice(0, 5).map(announcementCardHtml).join('') : '<div class="empty-state">No announcements posted.</div>'; }
    function normalizeAnnouncements(rows) { return rows.filter((item) => !['hidden', 'draft', 'deleted', 'archived'].includes(lower(item.visibility_status || item.status || item.announcement_status || ''))); }
    function announcementCardHtml(item) { const title = item.title || item.subject || 'Announcement'; const body = item.message || item.content || item.description || item.body || ''; const date = item.created_at || item.updated_at || ''; return `<article class="announcement-card"><strong>${escapeHtml(title)}</strong>${date ? `<span class="small-muted">${escapeHtml(formatDateTime(date))}</span>` : ''}<p>${escapeHtml(body || 'No details provided.')}</p></article>`; }
    function renderStatuses(profiles) { const normalized = { president: null, oic: null }; profiles.forEach((profile) => { const id = STATUS_EMAIL_MAP[lower(profile.email)]; if (id && !normalized[id]) normalized[id] = profile; }); renderStatus('president', normalized.president); renderStatus('oic', normalized.oic); }
    function renderStatus(id, profile) { const valueEl = byId(`${id}StatusValue`); const metaEl = byId(`${id}StatusMeta`); valueEl.textContent = profile?.activity_status || profile?.status_label || 'Status not posted'; const when = profile?.status_updated_at || profile?.updated_at || profile?.created_at; metaEl.textContent = when ? `Updated ${formatDateTime(when)}` : 'Waiting for update'; }
    function openEventDialog(event) { const record = event.extendedProps.record || {}; byId('eventDialogTitle').textContent = event.title; byId('eventDialogSubtitle').textContent = event.extendedProps.organization || 'Approved schedule'; const repeatUntil = record.repeat_until || record.recurrence_until || ''; const details = { Organization: event.extendedProps.organization, Venue: record.venue, Start: formatDateTime(event.start), End: event.end ? formatDateTime(event.end) : '', Category: record.category_id || record.event_type || record.category, Status: readable(record.approval_status), Repeat: readable(record.repeat || record.repeat_pattern || record.recurrence || 'Does not repeat'), 'Repeat Until': repeatUntil ? formatDate(repeatUntil) : '', 'Contact Person': record.contact_person, 'Contact Info': record.contact_info, Description: record.public_description || record.activity_description, Purpose: record.purpose }; byId('eventDetails').innerHTML = Object.entries(details).filter(([, value]) => value != null && String(value).trim()).map(([label, value]) => `<div class="detail-item"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`).join(''); byId('eventDialog').showModal(); }
